<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Крепость</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#10200f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f3e6c4}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{background:linear-gradient(#3a2a1d,#2a1d13);border:2px solid #b8893a;border-radius:12px;box-shadow:0 4px 18px #000a;padding:10px 12px}
#top{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:5px 8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));background:linear-gradient(#2b2016f5,#2b2016d0);border-bottom:2px solid #b8893a;font-size:14px;z-index:5}
.chip{display:flex;align-items:center;gap:3px;background:#0006;border-radius:8px;padding:3px 7px;white-space:nowrap;font-weight:600}
.chip.bad{background:#8a1c1c;animation:bl .8s infinite alternate}
@keyframes bl{to{background:#d03a2a}}
.sp{flex:1}
.btn{background:linear-gradient(#c9953a,#8f6320);color:#fff8e4;border:1px solid #e6c06a;border-radius:9px;padding:6px 12px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn:active{filter:brightness(1.25)}
.btn.s{padding:4px 9px;font-size:14px}
.btn.g{background:linear-gradient(#5c4a36,#3b2d20);border-color:#8a6d45}
.btn.on{background:linear-gradient(#5aa84a,#34702a);border-color:#a8e08a}
.btn.r{background:linear-gradient(#b8412f,#7a2218);border-color:#e08a7a}
#build{position:fixed;display:flex;gap:6px;background:#2b2016ee;border:2px solid #b8893a;z-index:5}
.bb{flex:0 0 auto;width:70px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#4b3826,#33261a);border:2px solid #7a5d36;border-radius:10px;padding:3px 2px;cursor:pointer;touch-action:manipulation;text-align:center}
.bb img{width:56px;height:46px;object-fit:contain;pointer-events:none}
.bb i{font-style:normal;font-size:24px;line-height:1.1}
.bb b{font-size:11px;line-height:1.15}
.bb span{font-size:10px;opacity:.85;line-height:1.2}
.bb.sel{border-color:#ffe08a;background:linear-gradient(#7a5a20,#5a4010);box-shadow:0 0 10px #ffd96088}
.bb.dis{opacity:.45}
#info{position:fixed;z-index:6;width:260px;max-width:calc(100% - 16px);font-size:14px;line-height:1.45}
#info .ih{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:4px}
#info .x{padding:2px 8px;cursor:pointer;opacity:.8}
.bar{height:8px;background:#0007;border-radius:4px;overflow:hidden;margin:4px 0}
.bar>div{height:100%;background:#58b948}
#info .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#toasts{position:fixed;left:0;right:0;top:56px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:9}
.toast{background:#1d140ef0;border:1px solid #b8893a;border-radius:9px;padding:6px 12px;font-size:14px;max-width:90%;text-align:center;animation:ti .25s}
.toast.bad{border-color:#e0584a;background:#4a1612f0}
.toast.good{border-color:#7ad06a}
@keyframes ti{from{opacity:0;transform:translateY(-6px)}}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
#mbox{width:480px;max-width:100%;max-height:100%;overflow:auto;touch-action:pan-y;font-size:15px;line-height:1.5}
#mbox h1{margin:0 0 6px;font-size:26px;text-align:center;color:#f0c24f;letter-spacing:2px}
#mbox h2{margin:6px 0 4px;font-size:17px;color:#f0c24f}
#mbox .col{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
#mbox .seg{display:flex;gap:4px;margin:4px 0}
#mbox .seg .btn{flex:1;padding:6px 2px;font-size:13px}
#mbox .sm{font-size:13px;opacity:.85}
#mbox p{margin:4px 0}
@media (orientation:landscape){
 #build{top:46px;right:0;bottom:0;width:84px;flex-direction:column;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:6px;padding-right:max(6px,env(safe-area-inset-right));border-right:0;border-bottom:0}
 .bb{width:100%}
 #info{left:max(8px,env(safe-area-inset-left));bottom:8px}
}
@media (orientation:portrait){
 #build{left:0;right:0;bottom:0;flex-direction:row;overflow-x:auto;touch-action:pan-x;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-left:0;border-right:0;border-bottom:0}
 #info{left:8px;bottom:92px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"></div>
<div id="build"></div>
<div id="info" class="card" hidden></div>
<div id="toasts"></div>
<div id="modal" hidden><div id="mbox" class="card"></div></div>
<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const W=48,H=48,TS=32,DAY=8,STEP=1/30,WIN_WAVE=12;
const G=0,TREE=1,ROCK=2,WATER=3;
const KX=22,KY=28;
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mkRng(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const hsh=(x,y,k)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(k,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};

const DEFS={
 keep:{name:'Донжон',w:3,h:3,hp:1500,cost:{},housing:8,icon:'🏰'},
 house:{name:'Хижина',w:2,h:2,hp:120,cost:{wood:12},housing:5,icon:'🏠'},
 wood:{name:'Лесоруб',w:2,h:2,hp:100,cost:{wood:8},workers:2,icon:'🪓'},
 quarry:{name:'Карьер',full:'Каменоломня',w:2,h:2,hp:140,cost:{wood:15},workers:3,icon:'⛏️'},
 farm:{name:'Ферма',w:3,h:3,hp:100,cost:{wood:20},workers:3,icon:'🌾'},
 wall:{name:'Стена',w:1,h:1,hp:260,cost:{stone:2},icon:'🧱'},
 tower:{name:'Башня',w:2,h:2,hp:320,cost:{wood:10,stone:20},workers:1,icon:'🗼'},
 barracks:{name:'Казарма',w:3,h:2,hp:260,cost:{wood:30,stone:20},icon:'⚔️'},
 church:{name:'Церковь',w:2,h:3,hp:200,cost:{wood:10,stone:25,gold:40},icon:'⛪'}
};
const ORDER=['house','wood','quarry','farm','wall','tower','barracks','church'];
const PRI={tower:0,farm:1,wood:2,quarry:3};
const TAXR=[0,.4,.8,1.3,2],TAXP=[12,4,-3,-12,-25],TAXN=['Нет','Низкие','Средние','Высокие','Грабёж'];
const RATM=[0,.5,1,1.5],RATP=[-25,-8,0,8],RATN=['Голод','Половина','Обычный','Двойной'];
const EN={
 raider:{name:'Налётчик',hp:35,hpw:4,dmg:6,sp:1.7,rng:1.15,cd:1,col:'#b23a3a',r:.3},
 archer:{name:'Лучник',hp:24,hpw:3,dmg:6,sp:1.5,rng:5.5,cd:1.5,col:'#8a46b0',r:.28},
 brute:{name:'Громила',hp:110,hpw:9,dmg:16,sp:1.15,rng:1.2,cd:1.6,col:'#4b2222',r:.42}
};

let map,amt,occ,shade,blds,nextId=1,S,enemies=[],soldiers=[],fx=[],peas=[],version=0;
let tool=null,selected=0,hover={x:-1,y:-1},uiPause=true,modalKind='',sfx=true;
let tc,tctx,dpr=1,lastSave=0,smokeT=0;
const cam={x:0,y:0,z:1};

/* ---------- sound ---------- */
let AC=null;
function tone(f,d,type,v,slide){
 if(!sfx)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
 }catch(e){}
}
const sndBuild=()=>{tone(220,.12,'square',.05);setTimeout(()=>tone(330,.12,'square',.05),70);};
const sndErr=()=>tone(110,.18,'sawtooth',.06);
const sndHit=()=>tone(160,.07,'square',.03,-60);
const sndHorn=()=>{tone(130,.7,'sawtooth',.09,-20);setTimeout(()=>tone(98,.8,'sawtooth',.09),350);};

/* ---------- toast ---------- */
let lastToast='',lastToastT=0;
function toast(msg,cls){
 const now=performance.now();
 if(msg===lastToast&&now-lastToastT<1500)return;
 lastToast=msg;lastToastT=now;
 const el=document.createElement('div');el.className='toast '+(cls||'');el.textContent=msg;
 const box=$('#toasts');box.appendChild(el);
 while(box.children.length>3)box.removeChild(box.firstChild);
 setTimeout(()=>el.remove(),3400);
}

/* ---------- helpers ---------- */
const afford=c=>{for(const k in c)if(S.res[k]<c[k])return false;return true;};
const pay=c=>{for(const k in c)S.res[k]-=c[k];};
const ICO={wood:'🪵',stone:'🪨',food:'🌾',gold:'🪙'};
const costStr=c=>Object.keys(c).map(k=>ICO[k]+c[k]).join(' ')||'—';
const count=t=>{let n=0;for(const b of blds.values())if(b.type===t)n++;return n;};
const housing=()=>{let h=0;for(const b of blds.values())h+=DEFS[b.type].housing||0;return h;};
const walk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&map[(y|0)*W+(x|0)]===G;

/* ---------- world gen ---------- */
function genShade(sd){const r=mkRng(sd);const s=new Uint8Array(W*H);for(let i=0;i<W*H;i++)s[i]=(r()*4)|0;return[s,r];}
function newGame(sd){
 sd=sd||(((Math.random()*1e9)|0)+1);
 const [sh,r]=genShade(sd);shade=sh;
 map=new Uint8Array(W*H);amt=new Uint16Array(W*H);occ=new Int32Array(W*H);
 blds=new Map();nextId=1;enemies=[];soldiers=[];fx=[];peas=[];version++;
 const blob=(cx,cy,rad,dens,type,a,over)=>{
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   const d=Math.hypot(x-cx,y-cy);
   if(d<rad*(.7+.5*r())&&r()<dens){const i=y*W+x;if(over||map[i]===G){map[i]=type;amt[i]=a;}}
  }
 };
 blob(KX-10,KY-2,4.6,.82,TREE,18);
 blob(KX+12,KY-4,3,.95,ROCK,45);
 blob(KX-4,KY+12,3.5,.72,TREE,18);
 blob(KX+9,KY+9,2.2,.9,ROCK,45);
 for(let k=0;k<9;k++)blob(r()*W,r()*H,2.5+r()*3.5,.75,TREE,18);
 for(let k=0;k<4;k++)blob(r()*W,r()*H,1.8+r()*1.5,.9,ROCK,45);
 for(let k=0;k<3;k++){
  let cx,cy,t=0;do{cx=r()*W;cy=r()*H;t++;}while(Math.hypot(cx-KX-1.5,cy-KY-1.5)<14&&t<50);
  blob(cx,cy,2.5+r()*2.5,1,WATER,0,true);
 }
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(Math.hypot(x+.5-(KX+1.5),y+.5-(KY+1.5))<6.4){const i=y*W+x;map[i]=G;amt[i]=0;}
 addBuilding('keep',KX,KY);
 S={day:1,t:0,res:{wood:90,stone:40,food:70,gold:100},pop:6,popu:60,tax:1,ration:2,wave:0,nextRaid:14,
  hunger:false,imm:0,speed:1,paused:false,won:false,over:false,seed:sd,kills:0,raidActive:false,raidSide:0,unemp:0,warned:false};
 tool=null;selected=0;
 assignStaff();syncPeas();renderTerrain();centerCam();
 buildBar();showInfo();hud(true);
}

/* ---------- buildings ---------- */
function addBuilding(type,x,y){
 const d=DEFS[type];
 const b={id:nextId++,type,x,y,w:d.w,h:d.h,hp:d.hp,max:d.hp,staff:0,eff:1,cx:x+d.w/2,cy:y+d.h/2,flash:0,cd:0,age:0};
 blds.set(b.id,b);
 for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++)occ[(y+j)*W+x+i]=b.id;
 version++;return b;
}
function canPlace(type,x,y){
 const d=DEFS[type];
 if(x<0||y<0||x+d.w>W||y+d.h>H)return false;
 for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++){const k=(y+j)*W+x+i;if(map[k]!==G||occ[k])return false;}
 return true;
}
const anchor=(type,tx,ty)=>{const d=DEFS[type];return[tx-((d.w-1)>>1),ty-((d.h-1)>>1)];};
function tryPlace(type,tx,ty,quiet){
 const d=DEFS[type],[ax,ay]=anchor(type,tx,ty);
 if(!canPlace(type,ax,ay)){if(!quiet){toast('Здесь строить нельзя');sndErr();}return false;}
 if(!afford(d.cost)){toast('Не хватает ресурсов: '+costStr(d.cost),'bad');sndErr();return false;}
 pay(d.cost);addBuilding(type,ax,ay);assignStaff();sndBuild();
 for(let k=0;k<5;k++)fx.push({t:'puff',x:(ax+d.w/2)*TS+(Math.random()-.5)*d.w*TS,y:(ay+d.h)*TS-4,life:.5,max:.5,col:'#cdbf9a',r:5});
 hud(true);
 return true;
}
function removeBld(b){
 const d=DEFS[b.type];
 for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++)occ[(b.y+j)*W+b.x+i]=0;
 blds.delete(b.id);version++;
 if(selected===b.id){selected=0;showInfo();}
}
function demolish(id){
 const b=blds.get(id);if(!b||b.type==='keep'){if(b)toast('Донжон нельзя снести');return;}
 const c=DEFS[b.type].cost;for(const k in c)S.res[k]+=Math.floor(c[k]*.5);
 removeBld(b);assignStaff();tone(180,.1,'triangle',.05);hud(true);
}
function destroyB(b){
 for(let k=0;k<10;k++)fx.push({t:'puff',x:b.cx*TS+(Math.random()-.5)*b.w*TS,y:b.cy*TS+(Math.random()-.5)*b.h*TS,life:.9,max:.9,col:'#6b5a46',r:7});
 removeBld(b);assignStaff();tone(90,.4,'sawtooth',.08,-30);
 if(b.type==='keep'){gameOver();return;}
 if(b.type!=='wall')toast('💥 Разрушено: '+DEFS[b.type].name,'bad');
 const hs=housing();if(S.pop>hs)S.pop=hs;
}
function dmgB(b,a){b.hp-=a;b.flash=.18;if(b.hp<=0&&blds.has(b.id))destroyB(b);}

function assignStaff(){
 let free=S.pop;
 const list=[...blds.values()].sort((a,b)=>((PRI[a.type]??9)-(PRI[b.type]??9))||(a.id-b.id));
 for(const b of list){const need=DEFS[b.type].workers||0;b.staff=Math.min(need,free);free-=b.staff;}
 S.unemp=free;
}

/* ---------- economy ---------- */
function harvest(b,rad,type,want){
 const cand=[];
 const x0=Math.max(0,Math.floor(b.cx-rad)),x1=Math.min(W-1,Math.ceil(b.cx+rad)),y0=Math.max(0,Math.floor(b.cy-rad)),y1=Math.min(H-1,Math.ceil(b.cy+rad));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x;if(map[i]===type){const d=Math.hypot(x+.5-b.cx,y+.5-b.cy);if(d<=rad)cand.push([d,i]);}}
 cand.sort((a,c)=>a[0]-c[0]);
 let got=0;
 for(const [,i] of cand){
  if(got>=want)break;
  const take=Math.min(amt[i],want-got);amt[i]-=take;got+=take;
  if(amt[i]<=0){map[i]=G;drawTile(i);}
 }
 b.eff=want>0?got/want:1;
 return got;
}
function rates(){
 assignStaff();
 let wood=0,stone=0,food=0;
 for(const b of blds.values()){
  if(!b.staff)continue;
  if(b.type==='wood')wood+=b.staff*2.2;
  else if(b.type==='quarry')stone+=b.staff*1.6;
  else if(b.type==='farm')food+=b.staff*1.5;
 }
 const eat=(S.pop+soldiers.length)*.3*RATM[S.ration];
 const target=55+TAXP[S.tax]+RATP[S.ration]+Math.min(3,count('church'))*10-(S.hunger?30:0);
 return{wood,stone,food:food-eat,prodFood:food,eat,gold:S.pop*TAXR[S.tax],target};
}
function dayTick(){
 S.day++;
 assignStaff();
 let w=0,s=0,f=0;
 for(const b of blds.values()){
  if(!b.staff)continue;
  if(b.type==='wood'){w+=harvest(b,5,TREE,b.staff*2.2);}
  else if(b.type==='quarry'){s+=harvest(b,3.2,ROCK,b.staff*1.6);}
  else if(b.type==='farm'){f+=b.staff*1.5;b.eff=1;}
 }
 S.res.wood+=w;S.res.stone+=s;S.res.food+=f;
 S.res.gold+=S.pop*TAXR[S.tax];
 const eat=(S.pop+soldiers.length)*.3*RATM[S.ration];
 S.res.food-=eat;
 S.hunger=false;
 if(S.res.food<0){S.res.food=0;if(eat>0){S.hunger=true;}}
 if(S.hunger){
  const lost=Math.max(1,Math.floor(S.pop*.08));
  if(S.pop>0){S.pop=Math.max(0,S.pop-lost);toast('😞 Голод! Крестьяне гибнут и уходят','bad');}
 }
 const tgt=rates().target;
 S.popu=clamp(S.popu+clamp(tgt-S.popu,-3,3),0,100);
 if(S.popu<20&&S.pop>0){const l=Math.max(1,Math.ceil(S.pop*.1));S.pop-=l;toast('Крестьяне уходят: народ недоволен','bad');}
 for(const b of blds.values())if(b.hp<b.max&&b.flash<=0)b.hp=Math.min(b.max,b.hp+Math.max(2,b.max*.01));
 const hs=housing();if(S.pop>hs)S.pop=hs;
 if(S.res.wood<=0&&count('wood')===0&&S.day%5===0)toast('Дерево закончилось — постройте лесоруба у леса');
 // raids
 const left=S.nextRaid-S.day;
 if(left===2&&!S.raidActive)toast('👁 Разведчики: враги подходят через 2 дня!','bad');
 if(S.day>=S.nextRaid&&!S.raidActive)spawnWave();
 assignStaff();
 if(S.day%2===0)save();
}

/* ---------- raids ---------- */
function spawnWave(){
 S.wave++;const n=S.wave;
 const side=(Math.random()*4)|0;const names=['севера','востока','юга','запада'];
 const list=[];
 for(let i=0;i<2+Math.floor(n*1.5);i++)list.push('raider');
 if(n>=3)for(let i=0;i<Math.floor((n-1)/2);i++)list.push('archer');
 if(n>=6)for(let i=0;i<Math.floor((n-4)/2);i++)list.push('brute');
 for(const k of list){
  let x,y;const t=(Math.random()-.5)*22;
  if(side===0){x=W/2+t;y=.8;}else if(side===1){x=W-.8;y=H/2+t;}else if(side===2){x=W/2+t;y=H-.8;}else{x=.8;y=H/2+t;}
  x=clamp(x,.8,W-.8);y=clamp(y,.8,H-.8);
  let tries=0;
  while(!walk(x,y)&&tries<40){x+=(W/2-x)*.06;y+=(H/2-y)*.06;tries++;}
  const d=EN[k];
  enemies.push({k,x:x+(Math.random()-.5)*1.4,y:y+(Math.random()-.5)*1.4,hp:d.hp+d.hpw*n,max:d.hp+d.hpw*n,cd:Math.random(),path:null,pi:0,pv:-1,rp:0,tb:0,flash:0});
 }
 for(const e of enemies){if(!walk(e.x,e.y)){e.x=Math.floor(e.x)+.5;e.y=Math.floor(e.y)+.5;}}
 S.raidActive=true;S.raidSide=side;
 S.nextRaid=S.day+Math.max(6,10-Math.floor(n/3));
 toast('⚔️ Набег с '+names[side]+'! Врагов: '+list.length,'bad');sndHorn();
}
function raidCleared(){
 S.raidActive=false;
 const bonus=20+S.wave*5;S.res.gold+=bonus;
 toast('🛡 Набег отбит! +'+bonus+' 🪙','good');
 tone(440,.15,'triangle',.07);setTimeout(()=>tone(660,.25,'triangle',.07),150);
 if(S.wave>=WIN_WAVE&&!S.won){S.won=true;setTimeout(()=>openModal('won'),600);}
 save();
}

/* ---------- pathfinding ---------- */
function tcost(i,g){
 if(i===g)return 1;
 if(map[i]!==G)return -1;
 const o=occ[i];
 if(o){const b=blds.get(o);return b&&b.type==='wall'?9:6;}
 return 1;
}
function findPath(sx,sy,gx,gy){
 const N=W*H,s=sy*W+sx,g=gy*W+gx;
 const gs=new Float32Array(N).fill(1e9),cm=new Int32Array(N).fill(-1),cl=new Uint8Array(N);
 const heap=[];
 const push=(i,f)=>{heap.push([f,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
 const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=k*2+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top[1];};
 gs[s]=0;push(s,0);
 while(heap.length){
  const c=pop();if(cl[c])continue;cl[c]=1;if(c===g)break;
  const cx=c%W,cy=(c/W)|0;
  for(const [dx,dy] of D4){
   const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;
   const n=ny*W+nx;if(cl[n])continue;
   const co=tcost(n,g);if(co<0)continue;
   const ng=gs[c]+co;
   if(ng<gs[n]){gs[n]=ng;cm[n]=c;push(n,ng+Math.abs(nx-gx)+Math.abs(ny-gy));}
  }
 }
 if(s!==g&&cm[g]<0)return null;
 const path=[];let c=g;
 while(c!==s&&c>=0){path.push(c);c=cm[c];}
 path.reverse();return path;
}
function rectDist(b,x,y){
 const dx=Math.max(b.x-x,0,x-(b.x+b.w)),dy=Math.max(b.y-y,0,y-(b.y+b.h));
 return Math.hypot(dx,dy);
}
function pickTarget(e){
 let best=null,bd=1e9;
 for(const b of blds.values()){
  if(b.type==='wall')continue;
  const d=rectDist(b,e.x,e.y);if(d<bd){bd=d;best=b;}
 }
 return best;
}
function computePath(e,tb){
 let gx=tb.x,gy=tb.y,bd=1e9;
 for(let j=0;j<tb.h;j++)for(let i=0;i<tb.w;i++){
  const d=Math.hypot(tb.x+i+.5-e.x,tb.y+j+.5-e.y);if(d<bd){bd=d;gx=tb.x+i;gy=tb.y+j;}
 }
 const sx=clamp(Math.floor(e.x),0,W-1),sy=clamp(Math.floor(e.y),0,H-1);
 e.path=findPath(sx,sy,gx,gy);e.pi=0;e.pv=version;e.rp=2.5+Math.random()*1.5;
}
function moveTo(o,tx,ty,dt,sp){
 const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
 if(d<1e-4)return 0;
 const st=Math.min(d,sp*dt);o.x+=dx/d*st;o.y+=dy/d*st;
 if(Math.abs(dx)>.02)o.dir=dx>0?1:-1;
 o.ph=(o.ph||0)+st*TS*.42;o.mv=1;
 return d-st;
}

/* ---------- units ---------- */
function shootFx(x1,y1,x2,y2,col){fx.push({t:'arrow',x1:x1*TS,y1:y1*TS-8,x2:x2*TS,y2:y2*TS-8,life:.22,max:.22,col:'#e8d8a8'});}
function enemyUpdate(e,dt){
 const d=EN[e.k];
 e.cd=Math.max(0,e.cd-dt);e.rp-=dt;e.flash=Math.max(0,e.flash-dt);
 // soldiers nearby
 let ts=null,bd=1e9;
 for(const s of soldiers){const dd=Math.hypot(s.x-e.x,s.y-e.y);if(dd<bd){bd=dd;ts=s;}}
 const aggro=Math.max(d.rng,2.4);
 if(ts&&bd<=aggro){
  if(bd<=d.rng){
   if(e.cd<=0){
    e.cd=d.cd;ts.hp-=d.dmg;ts.flash=.15;sndHit();
    if(d.rng>2)shootFx(e.x,e.y,ts.x,ts.y,'#c8a0e0');
   }
  }else moveTo(e,ts.x,ts.y,dt,d.sp);
  return;
 }
 let tb=blds.get(e.tb);
 if(!tb||tb.type==='wall'){tb=pickTarget(e);e.tb=tb?tb.id:0;e.path=null;}
 if(!tb)return;
 // archers shoot buildings in range
 if(d.rng>2){
  let tgt=null,td=1e9;
  for(const b of blds.values()){const dd=rectDist(b,e.x,e.y);if(dd<=d.rng){const pr=b.id===tb.id?dd-100:dd;if(pr<td){td=pr;tgt=b;}}}
  if(tgt){
   if(e.cd<=0){e.cd=d.cd;shootFx(e.x,e.y,tgt.cx,tgt.cy,'#c8a0e0');dmgB(tgt,d.dmg);}
   return;
  }
 }
 if(!e.path||e.pv!==version||e.rp<=0)computePath(e,tb);
 if(!e.path||e.pi>=e.path.length){
  // fallback: straight line
  if(rectDist(tb,e.x,e.y)<=d.rng+.2){if(e.cd<=0){e.cd=d.cd;dmgB(tb,d.dmg*(e.k==='brute'?1.6:1));sndHit();}}
  else moveTo(e,tb.cx,tb.cy,dt,d.sp*.8);
  return;
 }
 const ni=e.path[e.pi],nx=ni%W,ny=(ni/W)|0,ob=occ[ni];
 if(ob){
  const b=blds.get(ob);
  if(b&&e.cd<=0){e.cd=d.cd;dmgB(b,d.dmg*(e.k==='brute'?1.6:1));sndHit();
   fx.push({t:'puff',x:(nx+.5)*TS,y:(ny+.5)*TS,life:.3,max:.3,col:'#d9c9a0',r:3});}
  if(!b)e.path=null;
  return;
 }
 const left=moveTo(e,nx+.5,ny+.5,dt,d.sp);
 if(left<.05)e.pi++;
}
function soldierUpdate(s,dt,idx){
 s.cd=Math.max(0,s.cd-dt);s.flash=Math.max(0,s.flash-dt);
 let te=null,bd=1e9;
 for(const e of enemies){if(e.hp<=0)continue;const dd=Math.hypot(e.x-s.x,e.y-s.y);if(dd<bd){bd=dd;te=e;}}
 if(te&&bd<14){
  if(bd<=1.15){s.dir=te.x>=s.x?1:-1;if(s.cd<=0){s.cd=.8;s.atk=.28;te.hp-=10;te.flash=.12;sndHit();if(te.hp<=0)killEnemy(te);}}
  else moveTo(s,te.x,te.y,dt,2.4);
 }else{
  const rx=KX+1.5+((idx%5)-2)*.95,ry=KY+4.4+Math.floor(idx/5)*.95;
  moveTo(s,rx,ry,dt,1.6);
 }
}
function killEnemy(e){
 if(e.dead)return;e.dead=true;S.kills++;
 S.res.gold+=e.k==='brute'?6:2;
 for(let k=0;k<4;k++)fx.push({t:'puff',x:e.x*TS+(Math.random()-.5)*10,y:e.y*TS+(Math.random()-.5)*10,life:.5,max:.5,col:'#9a2a2a',r:4});
}
function towerUpdate(b,dt){
 b.cd=Math.max(0,b.cd-dt);
 if(b.cd>0)return;
 const isKeep=b.type==='keep';
 if(!isKeep&&!(b.type==='tower'&&b.staff>0))return;
 const rng=isKeep?6:7.5;let te=null,bd=1e9;
 for(const e of enemies){if(e.dead)continue;const dd=Math.hypot(e.x-b.cx,e.y-b.cy);if(dd<=rng&&dd<bd){bd=dd;te=e;}}
 if(te){b.cd=isKeep?1.2:1;te.hp-=isKeep?7:12;te.flash=.12;shootFx(b.cx,b.cy,te.x,te.y,'#f5e6a0');if(te.hp<=0)killEnemy(te);}
}
function syncPeas(){
 const n=Math.min(S.pop,40);
 const hs=[...blds.values()].filter(b=>b.type==='house'||b.type==='keep');
 while(peas.length<n&&hs.length){const h=hs[(Math.random()*hs.length)|0];peas.push({x:h.cx,y:h.y+h.h+.3,tx:h.cx,ty:h.y+h.h+.3,w:Math.random()*2,c:['#d9534f','#4a8fd0','#e0b040','#6aa860','#a070c0'][(Math.random()*5)|0]});}
 while(peas.length>n)peas.pop();
}
function peasUpdate(dt){
 for(const p of peas){
  p.w-=dt;
  if(p.w<=0){
   const nx=p.x+(Math.random()-.5)*5,ny=p.y+(Math.random()-.5)*5;
   if(walk(nx,ny)&&!occ[(ny|0)*W+(nx|0)]){p.tx=nx;p.ty=ny;}
   p.w=1.5+Math.random()*4;
  }
  moveTo(p,p.tx,p.ty,dt,.7);
 }
}

/* ---------- main step ---------- */
function step(dt){
 S.t+=dt/DAY;
 while(S.t>=1){S.t-=1;dayTick();if(S.over)return;}
 // immigration
 S.imm+=dt;
 if(S.imm>=2.5){S.imm=0;if(S.popu>=40&&S.pop<housing()){S.pop++;assignStaff();syncPeas();}}
 for(const e of enemies)if(!e.dead){e.mv=0;e.atk=Math.max(0,(e.atk||0)-dt);const c0=e.cd;enemyUpdate(e,dt);if(e.cd>c0+.2)e.atk=.28;}
 for(const s of soldiers){s.mv=0;s.atk=Math.max(0,(s.atk||0)-dt);}
 for(const p of peas)p.mv=0;
 for(const b of blds.values()){b.flash=Math.max(0,b.flash-dt);b.age+=dt;if(b.type==='tower'||b.type==='keep')towerUpdate(b,dt);}
 soldiers.forEach((s,i)=>soldierUpdate(s,dt,i));
 const had=enemies.length>0;
 enemies=enemies.filter(e=>!e.dead&&e.hp>0);
 for(const e of enemies){if(e.hp<=0)killEnemy(e);}
 soldiers=soldiers.filter(s=>s.hp>0);
 if(had&&enemies.length===0&&S.raidActive)raidCleared();
 for(const f of fx)f.life-=dt;
 fx=fx.filter(f=>f.life>0);
 peasUpdate(dt);
 smokeT+=dt;
 if(smokeT>.45){smokeT=0;for(const b of blds.values())if(b.type==='house'&&b.age>1&&Math.random()<.7)fx.push({t:'smoke',x:b.x*TS+SPR.house.smoke[0],y:b.y*TS+SPR.house.smoke[1]+6,vx:Math.random()-.3,life:2.2,max:2.2,r:3});}
}
function gameOver(){
 S.over=true;uiPause=true;
 try{localStorage.removeItem('stronghold_save');}catch(e){}
 setTimeout(()=>openModal('over'),400);
}

 try{
  const o={v:1,S,map:Array.from(map).join(''),amt:Array.from(amt),nextId,
   b:[...blds.values()].map(b=>[b.id,b.type,b.x,b.y,Math.round(b.hp)]),
   sol:soldiers.map(s=>[+s.x.toFixed(2),+s.y.toFixed(2),s.hp]),

}
function hasSave(){try{return !!localStorage.getItem('stronghold_save');}catch(e){return false;}}
function load(){
 try{
  const o=JSON.parse(localStorage.getItem('stronghold_save'));
  if(!o||o.v!==1)return false;
  S=o.S;shade=genShade(S.seed)[0];
  map=Uint8Array.from(o.map.split('').map(Number));amt=Uint16Array.from(o.amt);occ=new Int32Array(W*H);
  blds=new Map();nextId=o.nextId;
  for(const [id,type,x,y,hp] of o.b){const d=DEFS[type];const b={id,type,x,y,w:d.w,h:d.h,hp,max:d.hp,staff:0,eff:1,cx:x+d.w/2,cy:y+d.h/2,flash:0,cd:0,age:9};blds.set(id,b);for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++)occ[(y+j)*W+x+i]=id;}
  soldiers=o.sol.map(a=>({x:a[0],y:a[1],hp:a[2],cd:0,flash:0}));
  enemies=o.en.map(a=>{const d=EN[a[0]];return{k:a[0],x:a[1],y:a[2],hp:a[3],max:d.hp+d.hpw*Math.max(1,S.wave),cd:0,path:null,pi:0,pv:-1,rp:0,tb:0,flash:0};});
  fx=[];peas=[];version++;S.paused=false;S.speed=S.speed||1;
  tool=null;selected=0;
  assignStaff();syncPeas();renderTerrain();
  cam.x=o.cam[0];cam.y=o.cam[1];cam.z=o.cam[2];clampCam();
  buildBar();showInfo();hud(true);
  return true;
 }catch(e){return false;}

/* ---------- terrain rendering ---------- */
const TSC=2;
function vnoise(x,y,s){
 const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hsh(xi,yi,s),b=hsh(xi+1,yi,s),c=hsh(xi,yi+1,s),d=hsh(xi+1,yi+1,s);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function setupTerrainCanvas(){tc=document.createElement('canvas');tc.width=W*TS*TSC;tc.height=H*TS*TSC;tctx=tc.getContext('2d');}
function drawTile(){}
function renderTerrain(){
 if(!tc)setupTerrainCanvas();
 const c=tctx,F=TS*TSC,TW=W*F,TH=H*F,sd=(S.seed|0)+13;
 // smooth, organic grass colour field
 const nw=W*4,nh=H*4,sc=document.createElement('canvas');sc.width=nw;sc.height=nh;
 const sx=sc.getContext('2d'),id=sx.createImageData(nw,nh);
 for(let y=0;y<nh;y++)for(let x=0;x<nw;x++){
  const n=vnoise(x/11,y/11,sd)*.5+vnoise(x/5,y/5,sd+1)*.32+vnoise(x/2.2,y/2.2,sd+2)*.18;
  const p=(y*nw+x)*4;
  id.data[p]=62+n*58;id.data[p+1]=112+n*52;id.data[p+2]=40+n*22;id.data[p+3]=255;
 }
 sx.putImageData(id,0,0);
 c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 c.drawImage(sc,0,0,TW,TH);
 // grass tufts, flowers, pebbles
 c.lineCap='round';
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  if(map[y*W+x]===WATER)continue;
  const px=x*F,py=y*F;
  for(let k=0;k<5;k++){
   const tx=px+hsh(x,y,k+1)*F,ty=py+hsh(x,y,k+11)*F,dark=hsh(x,y,k+21)>.5;
   c.strokeStyle=dark?'rgba(30,70,25,.5)':'rgba(170,215,110,.45)';c.lineWidth=1.3;
   c.beginPath();
   c.moveTo(tx-3,ty);c.lineTo(tx-4.5,ty-6);
   c.moveTo(tx,ty);c.lineTo(tx+.5,ty-8);
   c.moveTo(tx+3,ty);c.lineTo(tx+5,ty-5.5);
   c.stroke();
  }
  const fl=hsh(x,y,40);
  if(fl<.13){
   const cols=['#fff6d8','#ffe266','#ff9ec0','#c9a8ff'];
   const n=1+((hsh(x,y,41)*3)|0);
   for(let k=0;k<n;k++){
    const fx0=px+hsh(x,y,50+k)*F,fy0=py+hsh(x,y,60+k)*F;
    c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.arc(fx0+.6,fy0+.8,2,0,7);c.fill();
    c.fillStyle=cols[(hsh(x,y,70+k)*4)|0];c.beginPath();c.arc(fx0,fy0,1.9,0,7);c.fill();
    c.fillStyle='#f4c430';c.beginPath();c.arc(fx0,fy0,.7,0,7);c.fill();
   }
  }
  if(hsh(x,y,80)<.07){
   const qx=px+hsh(x,y,81)*F,qy=py+hsh(x,y,82)*F;
   c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(qx+1,qy+1.5,4,2.2,0,0,7);c.fill();
   c.fillStyle='#9a9a94';c.beginPath();c.ellipse(qx,qy,3.6,2.4,0,0,7);c.fill();
   c.fillStyle='#bdbdb4';c.beginPath();c.ellipse(qx-.8,qy-.7,2,1.2,0,0,7);c.fill();
  }
 }
 // water: soft layered shoreline
 const R8=8;
 const isWt=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&map[y*W+x]===WATER;
 const layer=(e,col)=>{
  const lc=document.createElement('canvas');lc.width=W*R8;lc.height=H*R8;
  const lx=lc.getContext('2d');lx.fillStyle='#fff';let any=false;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   if(map[y*W+x]!==WATER)continue;any=true;
   const l=isWt(x-1,y)?0:-e,r=isWt(x+1,y)?0:e,t=isWt(x,y-1)?0:-e,b=isWt(x,y+1)?0:e;
   lx.fillRect(x*R8+l,y*R8+t,R8+(r-l),R8+(b-t));
  }
  if(!any)return;
  lx.globalCompositeOperation='source-in';lx.fillStyle=col;lx.fillRect(0,0,lc.width,lc.height);
  c.imageSmoothingEnabled=true;c.drawImage(lc,0,0,TW,TH);
 };
 layer(5,'rgba(216,200,144,.92)');
 layer(2.6,'rgba(150,210,220,.95)');
 layer(.8,'#59a6cc');
 layer(-1.2,'#4a93bf');
 layer(-2.8,'#3a7fae');
 layer(-4.4,'#2d6a98');
}

/* ---------- camera ---------- */
function clampCam(){
 const vw=innerWidth/cam.z,vh=innerHeight/cam.z;
 const mnx=-2*TS,mxx=W*TS+2*TS-vw,mny=-2*TS,mxy=H*TS+2*TS-vh;
 cam.x=mxx<mnx?(mnx+mxx)/2:clamp(cam.x,mnx,mxx);
 cam.y=mxy<mny?(mny+mxy)/2:clamp(cam.y,mny,mxy);
}
function centerCam(){
 cam.z=clamp(innerHeight/(15*TS),.6,1.5);
 cam.x=(KX+1.5)*TS-innerWidth/2/cam.z;
 cam.y=(KY+1.5)*TS-innerHeight/2/cam.z;

}

/* ---------- sprite factory ---------- */
const SC=2,SM=8;
const SPR={tree:[],rock:[],wall:[]};
let gtime=0;
function mkc(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*SC);c.height=Math.ceil(h*SC);const x=c.getContext('2d');x.scale(SC,SC);return[c,x];}
function rrect(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);
 c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function lgr(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);for(const s of st)g.addColorStop(s[0],s[1]);return g;}
function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();}
function brick(c,a,b,w,h,base,bw,bh,seed,mort){
 c.save();c.beginPath();c.rect(a,b,w,h);c.clip();
 c.fillStyle=base;c.fillRect(a,b,w,h);
 const rows=Math.ceil(h/bh)+1;
 for(let j=0;j<rows;j++){
  const off=(j%2)*bw/2;
  for(let i=-1;i<w/bw+1;i++){
   const v=hsh(i+seed,j,seed);
   c.fillStyle=v>.5?'rgba(255,255,255,'+((v-.5)*.3)+')':'rgba(0,0,0,'+((.5-v)*.34)+')';
   c.fillRect(a+i*bw+off+.4,b+j*bh+.4,bw-.8,bh-.8);
  }
 }
 c.strokeStyle=mort||'rgba(40,30,20,.38)';c.lineWidth=.5;c.beginPath();
 for(let j=0;j<=rows;j++){c.moveTo(a,b+j*bh);c.lineTo(a+w,b+j*bh);}
 for(let j=0;j<rows;j++){const off=(j%2)*bw/2;for(let i=-1;i<w/bw+1;i++){const vx=a+i*bw+off;c.moveTo(vx,b+j*bh);c.lineTo(vx,b+(j+1)*bh);}}
 c.stroke();c.restore();
}
function tiles(c,pts,x0,y0,x1,y1,top,bot,tw,th,seed){
 c.save();poly(c,pts);c.clip();
 c.fillStyle=lgr(c,0,y0,0,y1,[[0,top],[1,bot]]);c.fillRect(x0,y0,x1-x0,y1-y0);
 const rows=Math.ceil((y1-y0)/th)+1;
 for(let j=0;j<rows;j++){
  const y=y0+j*th,off=(j%2)*tw/2;
  for(let i=-1;i<(x1-x0)/tw+1;i++){
   const x=x0+i*tw+off,v=hsh(i,j,seed);
   c.fillStyle='rgba('+(v>.5?'255,255,255':'0,0,0')+','+(Math.abs(v-.5)*.2)+')';c.fillRect(x,y,tw,th);
   c.fillStyle='rgba(255,255,255,.1)';c.fillRect(x,y,tw,.9);
   c.fillStyle='rgba(0,0,0,.3)';c.fillRect(x,y+th-1,tw,1.1);
   c.fillStyle='rgba(0,0,0,.16)';c.fillRect(x+tw-.7,y,.7,th);
  }
 }
 c.restore();
}
function pad(c,w,h){
 c.fillStyle='rgba(120,94,58,.28)';rrect(c,-6,-4,w+12,h+9,12);c.fill();
 c.fillStyle='rgba(120,94,58,.3)';rrect(c,-2,0,w+4,h+3,8);c.fill();
}
function shadow(c,x,y,w,h,ox,oy,bl){
 c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=(bl||6)*SC;c.shadowOffsetX=(1000+(ox||6))*SC;c.shadowOffsetY=(oy||4)*SC;
 c.fillStyle='#000';c.fillRect(x-1000,y,w,h);c.restore();
}
function mkBld(pw,ph,rise,fn){
 const [c,x]=mkc(pw+2*SM,ph+rise+2*SM);x.translate(SM,SM+rise);fn(x,pw,ph);
 return{c,ox:-SM,oy:-SM-rise,w:pw+2*SM,h:ph+rise+2*SM};
}
function door(x,a,b,w,h,col){
 x.fillStyle=lgr(x,0,b,0,b+h,[[0,col||'#6a4424'],[1,'#34200e']]);rrect(x,a,b,w,h,w/2.6);x.fill();
 x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=.8;x.stroke();
 x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=.6;x.beginPath();
 for(let k=1;k<4;k++){x.moveTo(a+w*k/4,b+3);x.lineTo(a+w*k/4,b+h);}x.stroke();
 x.fillStyle='#d8b860';x.beginPath();x.arc(a+w*.78,b+h*.58,.9,0,7);x.fill();
}
function win(x,a,b,w,h){
 x.fillStyle='#4a2c14';x.fillRect(a-1.2,b-1.2,w+2.4,h+2.4);
 x.fillStyle=lgr(x,0,b,0,b+h,[[0,'#cfe9f4'],[1,'#6a9cbc']]);x.fillRect(a,b,w,h);
 x.fillStyle='#4a2c14';x.fillRect(a+w/2-.5,b,1,h);x.fillRect(a,b+h/2-.5,w,1);
 x.fillStyle='rgba(255,255,255,.35)';x.fillRect(a+1,b+1,w/2-2,2);
}
function merlons(x,a,b,w,n,col,dk){
 const sw=w/(n*2-1);
 for(let i=0;i<n;i++){const mx=a+i*sw*2;x.fillStyle=col;x.fillRect(mx,b-4.5,sw,4.5);x.strokeStyle=dk;x.lineWidth=.6;x.strokeRect(mx,b-4.5,sw,4.5);}
}
function cylinder(x,cx,top,bot,rad,cA,cB,cC,seed){
 // vertical stone cylinder with brick texture, ellipse base and top ring
 const ry=rad*.36;
 x.save();x.beginPath();x.moveTo(cx-rad,top);x.lineTo(cx-rad,bot);x.ellipse(cx,bot,rad,ry,0,Math.PI,0,true);x.lineTo(cx+rad,top);x.closePath();x.clip();
 x.fillStyle=lgr(x,cx-rad,0,cx+rad,0,[[0,cA],[.45,cB],[1,cC]]);x.fillRect(cx-rad,top-2,rad*2,bot-top+ry+4);
 x.strokeStyle='rgba(30,25,35,.32)';x.lineWidth=.5;x.beginPath();
 for(let yy=top;yy<bot+ry;yy+=4){x.moveTo(cx-rad,yy);x.quadraticCurveTo(cx,yy+ry*.9,cx+rad,yy);}
 for(let j=0,yy=top;yy<bot+ry;yy+=4,j++){for(let a=-rad+4+(j%2)*4;a<rad;a+=8){const t=a/rad,sy=yy+ry*.9*(1-t*t)*.5*2*.5;x.moveTo(cx+a,sy);x.lineTo(cx+a,sy+4);}}
 x.stroke();
 x.fillStyle='rgba(0,0,0,.18)';x.fillRect(cx-rad,top,rad*2,bot-top);
 x.fillStyle=lgr(x,cx-rad,0,cx+rad,0,[[0,'rgba(255,255,255,.22)'],[.4,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.4)']]);x.fillRect(cx-rad,top,rad*2,bot-top+ry);
 x.restore();
}

/* ---------- input ---------- */
const ptrs=new Map();let pinch=null,multi=false,wallPaint=false;
const tileAt=(sx,sy)=>[Math.floor((sx/cam.z+cam.x)/TS),Math.floor((sy/cam.z+cam.y)/TS)];
function startPinch(){
 const [a,b]=[...ptrs.values()];
 pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,wx:((a.x+b.x)/2)/cam.z+cam.x,wy:((a.y+b.y)/2)/cam.z+cam.y};
}
function doPinch(){
 const [a,b]=[...ptrs.values()];
 const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
 cam.z=clamp(pinch.z*d/pinch.d,.45,2.4);
 const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
 cam.x=pinch.wx-cx/cam.z;cam.y=pinch.wy-cy/cam.z;clampCam();
}
cv.addEventListener('pointerdown',e=>{
 if(!S||uiPause)return;
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false});
 hover={x:e.clientX,y:e.clientY};
 if(ptrs.size===2){multi=true;wallPaint=false;startPinch();}
 else if(ptrs.size===1&&tool==='wall'){wallPaint=true;const [tx,ty]=tileAt(e.clientX,e.clientY);tryPlace('wall',tx,ty,false);}
});
cv.addEventListener('pointermove',e=>{
 hover={x:e.clientX,y:e.clientY};
 const p=ptrs.get(e.pointerId);if(!p)return;
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size>=2){if(pinch)doPinch();p.moved=true;return;}
 if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8)p.moved=true;
 if(wallPaint){const [tx,ty]=tileAt(e.clientX,e.clientY);tryPlace('wall',tx,ty,true);}
 else if(p.moved){cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam();}
});
function endPtr(e){
 const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
 if(!p)return;
 if(!p.moved&&!multi&&!wallPaint&&e.type==='pointerup')tap(e.clientX,e.clientY);
 if(ptrs.size<2)pinch=null;
 if(ptrs.size===0){multi=false;wallPaint=false;}
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{
 if(!S||uiPause)return;e.preventDefault();
 const wx=e.clientX/cam.z+cam.x,wy=e.clientY/cam.z+cam.y;
 cam.z=clamp(cam.z*(e.deltaY<0?1.12:.89),.45,2.4);
 cam.x=wx-e.clientX/cam.z;cam.y=wy-e.clientY/cam.z;clampCam();
},{passive:false});
function tap(sx,sy){
 if(S.over)return;
 const [tx,ty]=tileAt(sx,sy);
 if(tool==='demolish'){
  if(tx>=0&&ty>=0&&tx<W&&ty<H){const o=occ[ty*W+tx];if(o)demolish(o);}
  return;
 }
 if(tool){tryPlace(tool,tx,ty,false);return;}
 if(tx>=0&&ty>=0&&tx<W&&ty<H&&occ[ty*W+tx])select(occ[ty*W+tx]);else select(0);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');
 if(t&&t.closest('#build')){setTool(t.dataset.t);return;}
 const a=e.target.closest('[data-a]');if(!a)return;
 const act=a.dataset.a,v=+a.dataset.v;
 switch(act){
  case 'speed':if(S.paused){S.paused=false;S.speed=1;}else if(S.speed<3)S.speed++;else{S.speed=1;S.paused=true;}hud(true);break;
  case 'treasury':openModal('treasury');break;
  case 'menu':openModal('menu');break;
  case 'army':{for(const b of blds.values())if(b.type==='barracks'){select(b.id);return;}toast('Постройте казарму, чтобы нанимать воинов');break;}
  case 'closeinfo':select(0);break;
  case 'hire':hire();break;
  case 'demolish':if(selected)demolish(selected);break;
  case 'tax':S.tax=v;openModal('treasury',true);hud(true);break;
  case 'ration':S.ration=v;openModal('treasury',true);hud(true);break;
  case 'closem':closeModal();break;
  case 'resume':closeModal();break;
  case 'savegame':save();toast('💾 Игра сохранена','good');break;
  case 'sound':sfx=!sfx;openModal('menu',true);break;
  case 'help':case 'help2':hudStart=(act==='help');openModal('help');break;
  case 'start':openModal('start');break;
  case 'continue':if(load()){closeModal();hudStart=false;toast('Игра загружена','good');}else{toast('Сохранение не найдено','bad');}break;
  case 'new':closeModal();hudStart=false;newGame();toast('Постройте лесоруба 🪓 рядом с лесом и хижины 🏠','good');setTimeout(()=>toast('Налоги и рацион — в ⚖️ Казне. Первый набег придёт на 14-й день'),5000);break;
 }
});
addEventListener('keydown',e=>{
 if(!S||uiPause&&modalKind!=='treasury')return;
 const sp=40/cam.z;
 if(e.key==='ArrowLeft'||e.key==='a')cam.x-=sp;else if(e.key==='ArrowRight'||e.key==='d')cam.x+=sp;
 else if(e.key==='ArrowUp'||e.key==='w')cam.y-=sp;else if(e.key==='ArrowDown'||e.key==='s')cam.y+=sp;
 else if(e.key==='+'||e.key==='=')cam.z=clamp(cam.z*1.1,.45,2.4);else if(e.key==='-')cam.z=clamp(cam.z/1.1,.45,2.4);
 else if(e.key===' '){S.paused=!S.paused;hud(true);e.preventDefault();}
 else if(e.key==='Escape'){if(modalKind)closeModal();else if(tool)setTool(null);else select(0);}
 else if(e.key>='1'&&e.key<='9'){const t=ORDER[+e.key-1];if(t)setTool(t);}
 clampCam();
});
window.__back=()=>{
 if(modalKind==='start')return false;
 if(modalKind){closeModal();return true;}
 if(tool){setTool(null);return true;}
 if(selected){select(0);return true;}
 const now=Date.now();
 if(window.__bk&&now-window.__bk<2500){save();return false;}
 window.__bk=now;toast('Нажмите «Назад» ещё раз для выхода');return true;
};
window.__pause=()=>{save();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---------- loop ---------- */
let last=performance.now(),acc=0,hudT=0;
function frame(now){
 const fdt=Math.min(.1,(now-last)/1000);last=now;
 if(S&&!S.paused&&!uiPause&&!S.over){
  acc+=fdt*S.speed;
  let n=0;
  while(acc>=STEP&&n<12){step(STEP);acc-=STEP;n++;if(S.over)break;}
  if(acc>STEP*12)acc=0;
  hudT+=fdt;
  if(hudT>.25){hudT=0;hud();}
  lastSave+=fdt;if(lastSave>25){lastSave=0;save();}
 }
 render();
 requestAnimationFrame(frame);
}
resize();
makeSprites();
newGame();
openModal('start');
requestAnimationFrame(frame);
window.__dbg={get S(){return S;},get blds(){return blds;},get enemies(){return enemies;},get soldiers(){return soldiers;},tryPlace,newGame,step,spawnWave,hire,cam,dayTick,hud,openModal,closeModal,rates,get uiPause(){return uiPause;},set uiPause(v){uiPause=v;},setTool,select,KX,KY,map};
})();
</script>
