plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stronghold.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stronghold.game'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подпись отладочным ключом: APK устанавливается на телефон напрямую.
            // Для публикации в Google Play подпишите своим ключом.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
